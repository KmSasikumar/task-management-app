databases:
  - name: task-management-db
    plan: free
    databaseName: taskdb
    user: taskuser

services:
  - type: web
    name: task-management-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: task-management-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false  # Set manually after Vercel deploy
      - key: NODE_ENV
        value: production
